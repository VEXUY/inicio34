<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX UY - Tienda Online</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background-color: #181818 !important;
            border-bottom: 2px solid #ff5722;
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff !important;
        }
        .card-producto {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            color: #fff;
            transition: transform 0.2s;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card-producto:hover {
            transform: translateY(-5px);
            border-color: #ff5722;
        }
        .card-img-top {
            height: 220px;
            object-fit: cover;
            background-color: #252525;
            cursor: pointer;
        }
        .btn-comprar {
            background-color: #25d366;
            border: none;
            color: #fff;
            font-weight: bold;
        }
        .btn-comprar:hover {
            background-color: #1ebe5d;
            color: #fff;
        }
        .badge-stock {
            font-size: 0.85rem;
            padding: 5px 10px;
        }
        /* Estilos del Modal */
        .modal-content {
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
        }
        .modal-header, .modal-footer {
            border-color: #2d2d2d;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm py-3 mb-4">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-store me-2 text-warning"></i>VEX UY</a>
            <span class="text-secondary small">Envíos a todo Uruguay</span>
        </div>
    </nav>

    <!-- Catálogo de Productos -->
    <div class="container my-4">
        <h2 class="fw-bold mb-4 text-warning"><i class="fa-solid fa-fire me-2"></i>Catálogo en Vivo</h2>
        
        <div class="row g-4" id="lista-productos">
            <!-- Carga por JS -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="text-secondary mt-2">Conectando con el servidor de VEX UY...</p>
            </div>
        </div>
    </div>

    <!-- Modal de Detalle de Producto -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-warning" id="modalNombre">Detalle del Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImagen" src="" class="img-fluid rounded mb-3" style="max-height: 250px; object-fit: cover;" alt="Producto">
                    <h4 id="modalPrecio" class="text-warning fw-bold mb-2"></h4>
                    <p id="modalStock" class="text-secondary small mb-3"></p>
                </div>
                <div class="modal-footer">
                    <a id="modalBotonWpp" href="#" target="_blank" class="btn btn-comprar w-100 py-2">
                        <i class="fa-brands fa-whatsapp me-2"></i> Consultar / Comprar por WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Socket.io cliente -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // URL de tu túnel en la laptop
        const BACKEND_URL = 'https://vexuy.loca.lt';

        // Cabeceras obligatorias para saltar la pantalla de LocalTunnel
        const tunnelHeaders = {
            'Content-Type': 'application/json',
            'Bypass-Tunnel-Reminder': 'true'
        };

        async function cargarProductos() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/productos`, {
                    headers: tunnelHeaders
                });
                const productos = await res.json();
                renderizar(productos);
            } catch (err) {
                console.error("Error al cargar productos:", err);
                document.getElementById('lista-productos').innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        <i class="fa-solid fa-triangle-exclamation fa-2x mb-2"></i>
                        <p>El servidor local está apagado o el túnel no está activo.</p>
                    </div>
                `;
            }
        }

        function renderizar(productos) {
            const contenedor = document.getElementById('lista-productos');
            contenedor.innerHTML = '';

            if (productos.length === 0) {
                contenedor.innerHTML = '<p class="text-center text-muted">No hay productos disponibles por el momento.</p>';
                return;
            }

            productos.forEach(p => {
                let badgeStockColor = 'bg-success';
                let estadoStock = `${p.stock} disponibles`;
                if (p.stock <= 0) {
                    badgeStockColor = 'bg-danger';
                    estadoStock = 'Agotado';
                } else if (p.stock <= 3) {
                    badgeStockColor = 'bg-warning text-dark';
                    estadoStock = `¡Últimos ${p.stock}!`;
                }

                const mensajeWpp = encodeURIComponent(`Hola! Me interesa el producto *${p.nombre}* a $${p.precio}. ¿Sigue disponible?`);
                const linkWpp = `https://wa.me/59896224163?text=${mensajeWpp}`; // Reemplaza con tu número

                contenedor.innerHTML += `
                    <div class="col-md-4 col-sm-6">
                        <div class="card card-producto h-100 shadow-sm">
                            <img src="${p.imagen}" class="card-img-top" alt="${p.nombre}" onclick="abrirModal(${p.id}, '${p.nombre}', '${p.imagen}', ${p.precio}, ${p.stock})">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title fw-bold">${p.nombre}</h5>
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <span class="text-warning fs-5 fw-bold">$${p.precio} UYU</span>
                                    <span class="badge ${badgeStockColor} badge-stock">${estadoStock}</span>
                                </div>
                                <button class="btn btn-outline-light btn-sm mt-auto w-100 mb-2" onclick="abrirModal(${p.id}, '${p.nombre}', '${p.imagen}', ${p.precio}, ${p.stock})">
                                    <i class="fa-solid fa-eye me-1"></i> Ver Detalles
                                </button>
                                <a href="${linkWpp}" target="_blank" class="btn btn-comprar w-100 py-2">
                                    <i class="fa-brands fa-whatsapp me-2"></i> Comprar
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function abrirModal(id, nombre, imagen, precio, stock) {
            document.getElementById('modalNombre').innerText = nombre;
            document.getElementById('modalImagen').src = imagen;
            document.getElementById('modalPrecio').innerText = `$${precio} UYU`;
            document.getElementById('modalStock').innerText = stock > 0 ? `Stock disponible: ${stock} unidades` : 'Producto agotado';
            
            const mensajeWpp = encodeURIComponent(`Hola! Me interesa el producto *${nombre}* a $${precio}. ¿Sigue disponible?`);
            document.getElementById('modalBotonWpp').href = `https://wa.me/59800000000?text=${mensajeWpp}`;

            const modal = new bootstrap.Modal(document.getElementById('modalProducto'));
            modal.show();
        }

        // Conexión en tiempo real con WebSockets hacia tu laptop
        const socket = io(BACKEND_URL, {
            extraHeaders: {
                'Bypass-Tunnel-Reminder': 'true'
            }
        });

        socket.on('actualizar_tienda', (productos) => {
            renderizar(productos);
        });

        // Cargar al iniciar
        cargarProductos();
    </script>
</body>
</html>
